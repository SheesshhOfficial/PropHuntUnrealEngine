<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card { fill: #101827; stroke: #243248; stroke-width: 2; rx: 12; }
      .title { fill: #ffffff; font-family: sans-serif; font-weight: 800; font-size: 36px; }
      .subtitle { fill: #ffad59; font-family: sans-serif; font-weight: 600; font-size: 18px; }
      .text-head { fill: #ffffff; font-family: sans-serif; font-weight: 700; font-size: 20px; }
      .text-body { fill: #afc0d4; font-family: sans-serif; font-size: 15px; }
      .slot { fill: #1e293b; stroke: #ffad59; stroke-width: 1.5; stroke-dasharray: 6 6; rx: 8; }
      .slot-text { fill: #ffad59; font-family: sans-serif; font-weight: 700; font-size: 16px; text-anchor: middle; }
      .slot-sub { fill: #94a3b8; font-family: sans-serif; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #ffad59; stroke-width: 3; fill: none; marker-end: url(#arrow-o); }
    </style>
    <marker id="arrow-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffad59" />
    </marker>
  </defs>
  <rect width="1920" height="1080" class="bg" />

  <!-- Header -->
  <rect x="80" y="40" width="1760" height="80" class="card" />
  <rect x="110" y="55" width="160" height="28" rx="14" fill="#ffad59" />
  <text x="190" y="74" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0b0f19" text-anchor="middle">HUNTER JOURNEY</text>
  <text x="290" y="80" class="title">02.01 - 02.05 Hunter Role &amp; Elimination Sequence</text>
  <text x="290" y="105" class="subtitle">Armed Hitscan Mechanics, Aiming Feedback, HUD Layout, and Outcome Matrix</text>

  <!-- Left: HUD Layout & Overview -->
  <rect x="80" y="150" width="860" height="420" class="card" />
  <text x="110" y="190" class="text-head">02.01 Hunter POV &amp; HUD Anatomy</text>
  <text x="110" y="215" class="text-body">• Pawn: BP_ThirdPersonCharacter | StormTrooper Mesh</text>
  <text x="110" y="235" class="text-body">• HUD Indicators: Round timer, Hunter health, Hitscan crosshair, Remaining props</text>
  
  <rect x="110" y="260" width="800" height="280" class="slot" />
  <circle cx="510" cy="380" r="28" fill="#334155" />
  <text x="510" y="388" font-family="sans-serif" font-size="22" fill="#ffad59" text-anchor="middle">📷</text>
  <text x="510" y="430" class="slot-text">IMG-02-HUNTER-HUD (960x540)</text>
  <text x="510" y="455" class="slot-sub">Hunter POV showing active reticle, ammo count, and round timer</text>

  <!-- Right: Aiming Sensitivity -->
  <rect x="980" y="150" width="860" height="420" class="card" />
  <text x="1010" y="190" class="text-head">02.02 Search Tactics &amp; Aim Sensitivity Response</text>
  <text x="1010" y="215" class="text-body">• Movement: IA_Move (WASD), IA_Look (Mouse), IA_Jump (Spacebar)</text>
  <text x="1010" y="235" class="text-body">• Verified Sensitivity: Yaw delta 5 at 0.2 sens, scaling to 20 at 0.8 sens (4x ratio)</text>

  <rect x="1010" y="260" width="800" height="280" class="slot" />
  <circle cx="1410" cy="380" r="28" fill="#334155" />
  <text x="1410" y="388" font-family="sans-serif" font-size="22" fill="#ffad59" text-anchor="middle">📷</text>
  <text x="1410" y="430" class="slot-text">IMG-02-HUNTER-AIM (960x540)</text>
  <text x="1410" y="455" class="slot-sub">Hunter scanning Egyptian courtyard down long sightlines</text>

  <!-- Bottom: 3-Step Hitscan & Elimination Sequence -->
  <rect x="80" y="600" width="1760" height="430" class="card" />
  <text x="110" y="640" class="text-head">02.03 - 02.05 Shoot &amp; Deal Damage Progression Sequence</text>

  <!-- Step 1: Aim Target -->
  <rect x="110" y="670" width="520" height="330" class="slot" />
  <text x="370" y="710" class="slot-text">STEP 1: TARGET ACQUISITION</text>
  <text x="370" y="735" class="slot-sub">IMG-02-SHOOT-AIM (800x450)</text>
  <circle cx="370" cy="810" r="24" fill="#334155" />
  <text x="370" y="818" font-family="sans-serif" font-size="18" fill="#ffad59" text-anchor="middle">📷</text>
  <text x="370" y="870" class="slot-sub">Align crosshair on suspect environmental pot</text>
  <text x="370" y="895" class="slot-sub">Inspection needed: Reticle color change on target</text>

  <!-- Step 2: Fire Hitscan -->
  <rect x="700" y="670" width="520" height="330" class="slot" />
  <text x="960" y="710" class="slot-text">STEP 2: HITSCAN EXECUTION</text>
  <text x="960" y="735" class="slot-sub">IMG-02-SHOOT-FIRE (800x450)</text>
  <circle cx="960" cy="810" r="24" fill="#334155" />
  <text x="960" y="818" font-family="sans-serif" font-size="18" fill="#ffad59" text-anchor="middle">📷</text>
  <text x="960" y="870" class="slot-sub">IA_shoot line trace with muzzle flash and tracer</text>
  <text x="960" y="895" class="slot-sub">Miss penalty: Firing non-props costs integrity</text>

  <!-- Step 3: Damage & Elimination -->
  <rect x="1290" y="670" width="520" height="330" class="slot" />
  <text x="1550" y="710" class="slot-text">STEP 3: DAMAGE &amp; OUTCOME</text>
  <text x="1550" y="735" class="slot-sub">IMG-02-SHOOT-DAMAGE (800x450)</text>
  <circle cx="1550" cy="810" r="24" fill="#334155" />
  <text x="1550" y="818" font-family="sans-serif" font-size="18" fill="#ffad59" text-anchor="middle">📷</text>
  <text x="1550" y="870" class="slot-sub">Prop hit reaction and P_Explosion on elimination</text>
  <text x="1550" y="895" class="slot-sub">Outcome: All props eliminated = Hunter Victory [USER-TESTED]</text>

  <!-- Connectors between steps -->
  <path d="M 640 835 L 690 835" class="arrow" />
  <path d="M 1230 835 L 1280 835" class="arrow" />
</svg>
